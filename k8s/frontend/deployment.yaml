apiVersion: apps/v1
kind: Deployment
metadata:
  name: academic-summarizer-frontend
  labels:
    app: academic-summarizer
    component: frontend
    tier: ui
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: academic-summarizer
      component: frontend
  template:
    metadata:
      labels:
        app: academic-summarizer
        component: frontend
        tier: ui
    spec:
      containers:
        - name: web-ui
          image: ghcr.io/adarsh/academic-summarizer-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          # Ultra-lightweight footprint (Nginx Alpine)
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
