services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mlops-academic-summarizer-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DEVICE=cpu
      - FORCE_CPU=true
      - MAX_WORKERS=1
      - USE_MOCK_MODEL=${USE_MOCK_MODEL:-false}
      - MAX_INPUT_CHARS=50000
      - MAX_INPUT_TOKENS=2048
      - MEMORY_THRESHOLD_MB=2560.0
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2560M
        reservations:
          cpus: "0.5"
          memory: 1024M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - mlops-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mlops-academic-summarizer-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge
